[project]
name = "tm-twitch-bot"
version = "0.1.0"
description = "為 Twitch 頻道 tigermeowtw 打造的聊天互動機器人"
authors = [
    {name = "pohsiangjuan", email = "pohsiangjuan@igs.com.tw"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "twitchio>=2.10,<3", # 3.x API 不相容（Bot 建構、事件模型大改），升級屬獨立工程
    "twitchapi",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "httpx",
    "python-dotenv",
    "attrs", # utils/dump_obj_utils.py 真的 import attr。過去只靠 twitchAPI 的
             # 傳遞依賴才裝得到，twitchAPI 哪天不用 attrs 就會壞。
             # （那支是手動除錯工具，零呼叫端是刻意的，第九輪決定保留）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tm_twitch_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 測試全部是 async，開 auto 模式就不必每個函式都掛 @pytest.mark.asyncio
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 刻意只開「會抓到真問題」的規則，不開會大規模改寫程式碼的那些：
#   F  pyflakes —— 未使用的 import／變數、拼錯的名字，價值最高
#   E/W pycodestyle —— 基本排版錯誤
#   B  bugbear —— 可變預設參數、except 抓太寬這類真的會出事的寫法
# 刻意不開：
#   I  (isort) 會把每個檔案的 import 重排。本專案的 import 是刻意手排的，
#      重排會製造一份巨大且沒有價值的 diff，還讓 git blame 失效
#   UP (pyupgrade)、SIM 同理，屬於「改寫既有正確程式碼」而非抓錯
select = ["F", "E", "W", "B"]
# E501（行太長）不開：專案裡有大量中文 f-string 訊息，
# 為了湊行寬去拆字串反而更難讀，長度問題交給 line-length 當軟性參考
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.coverage.run]
source = ["tm_twitch_bot"]

[tool.coverage.report]
# 每個模組結尾的 `if __name__ == "__main__":` 手動試跑區塊不列入計算——
# 那是開發時單獨跑某支腳本用的，不是產品路徑
exclude_also = [
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
