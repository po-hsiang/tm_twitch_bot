[project]
name = "tm-twitch-bot"
version = "0.1.0"
description = "為 Twitch 頻道 tigermeowtw 打造的聊天互動機器人"
authors = [
    {name = "pohsiangjuan", email = "pohsiangjuan@igs.com.tw"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "twitchio>=2.10,<3", # 3.x API 不相容（Bot 建構、事件模型大改），升級屬獨立工程
    "twitchapi",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "httpx",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm_twitch_bot"]
